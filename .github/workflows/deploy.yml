
name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::031888990955:role/GitHubPortfolioDeploymentRole
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://aws-website-portfolio-jerry \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1WPI90PHCPZV7 \
            --paths "/*"
