<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav>
        <div class="logo">Jerry Selenou</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="projects.html">AWS Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="contact">

        <h1>Let's Connect</h1>
    
        <p>
            Have a question, opportunity, or just want to connect? Send me a message below.
        </p>
    
        <form id="contact-form">
    
            <input
                type="text"
                id="name"
                placeholder="Your Name"
                required
            >
    
            <input
                type="email"
                id="email"
                placeholder="Your Email"
                required
            >
    
            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required
            >
    
            <textarea
                id="message"
                rows="6"
                placeholder="Your Message"
                required
            ></textarea>
    
            <button type="submit" class="btn">
                Send Message
            </button>
    
        </form>
    
        <p id="status-message"></p>
    
    </section>
    <footer>
        <p>
            © 2026 Jerry Selenou | AWS Cloud Engineer Portfolio
        </p>
    </footer>
    <script src="assets/js/contact.js"></script>
</body>
</html>
